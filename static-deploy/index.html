<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volt — Local-First Development Operating Environment</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    #boot-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000000;
      color: #e0e0e0;
      font-family: 'Consolas', 'Cascadia Code', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease;
    }
    #boot-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .boot-logo {
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 40px;
      color: #fff;
    }
    .boot-progress-container {
      width: 420px;
      height: 4px;
      background: #222;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .boot-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffffff, #cccccc);
      transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 10px rgba(255,255,255,0.5);
    }
    .boot-status {
      font-size: 13px;
      opacity: 0.7;
      margin-bottom: 8px;
      min-height: 18px;
    }
    .boot-version {
      font-size: 11px;
      opacity: 0.4;
      margin-top: 60px;
    }
  </style>
</head>
<body class="theme-pure-black">
  <!-- Boot Screen -->
  <div id="boot-screen">
    <div class="boot-logo">Volt</div>
    
    <div class="boot-progress-container">
      <div id="boot-progress-bar" class="boot-progress-bar"></div>
    </div>
    
    <div id="boot-status" class="boot-status">Initializing...</div>
    <div class="boot-version">v1.0.0 — Local-First Development Environment</div>
  </div>

  <div id="volt-viewport"></div>

  <script>
    // Animated Boot Screen Controller
    (function() {
      const bootScreen = document.getElementById('boot-screen');
      const progressBar = document.getElementById('boot-progress-bar');
      const statusText = document.getElementById('boot-status');

      const bootSteps = [
        { text: "Initializing system...", percent: 15 },
        { text: "Loading Virtual Filesystem...", percent: 35 },
        { text: "Mounting Terminal Engine...", percent: 55 },
        { text: "Preparing Editor Environment...", percent: 75 },
        { text: "Restoring Workspace...", percent: 90 },
        { text: "Ready.", percent: 100 }
      ];

      let currentStep = 0;

      function runBootSequence() {
        if (currentStep >= bootSteps.length) {
          // Boot complete - hide boot screen
          setTimeout(() => {
            bootScreen.classList.add('fade-out');
            setTimeout(() => {
              bootScreen.style.display = 'none';
            }, 600);
          }, 400);
          return;
        }

        const step = bootSteps[currentStep];
        statusText.textContent = step.text;
        progressBar.style.width = step.percent + '%';

        currentStep++;

        // Different timing for more natural feel
        const delay = currentStep === 1 ? 400 : (currentStep === bootSteps.length ? 600 : 550);
        setTimeout(runBootSequence, delay);
      }

      // Start boot animation after a tiny delay
      setTimeout(runBootSequence, 120);
    })();
  </script>

  <script src="app.js"></script>
</body>
</html>
